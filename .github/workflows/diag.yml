name: 진단 — 브리지 답 받아오기 (VPN 전/후 비교)

# 2026-09-10 사고 조사용. 손으로만 돌린다.
# 시트를 바꾸지 않는다(read 만 한다). 텔레그램도 보내지 않는다.
# ★ 답의 '내용'은 절대 찍지 않는다 — 공개 로그다. 크기(바이트)만 남긴다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: 브리지 전송 진단
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: A. VPN 끄고 · 짧은 답
        env:
          SHEET_BRIDGE_URL: ${{ secrets.SHEET_BRIDGE_URL }}
          TOK: 
        run: |
          set +e
          echo "── A. VPN 끄고 · 짧은 답 ── (틀린 잠금값 — 짧은 답만 온다)"
          C=$(curl -fsS --max-time 10 https://ipinfo.io/country | tr -d '[:space:]')
          echo "출구 국가: $C"
          ok=0; bad=0
          for i in 1 2 3 4 5 6 7 8; do
            H=$(curl -s -o /dev/null -D - --max-time 60 -X POST "$SHEET_BRIDGE_URL" \
                 -H 'Content-Type: application/json' \
                 -d "{\"token\":\"$TOK\",\"action\":\"read\"}" | tr -d '\r')
            S1=$(echo "$H" | awk '/^HTTP\//{print $2}' | head -1)
            L=$(echo "$H" | awk 'BEGIN{IGNORECASE=1}/^location:/{print $2}')
            if [ -z "$L" ]; then echo "  $i) POST=$S1 넘김없음"; bad=$((bad+1)); sleep 2; continue; fi
            S2=$(curl -s -o /tmp/ans.bin -w '%{http_code}' --max-time 60 "$L")
            N=$(wc -c < /tmp/ans.bin | tr -d ' ')
            # 내용은 절대 찍지 않는다 — 업체명·도메인이 공개 로그에 남으면 안 된다.
            if [ "$S2" = "200" ] && [ "$N" -gt 20 ]; then ok=$((ok+1)); else bad=$((bad+1)); fi
            echo "  $i) POST=$S1 → 답 $S2 · ${N}바이트"
            sleep 2
          done
          echo "결과: 성공 $ok / 실패 $bad"
          { echo "## A. VPN 끄고 · 짧은 답"; echo "- 출구 국가: $C"; echo "- **성공 $ok / 실패 $bad** (8회)"; echo; } >> "$GITHUB_STEP_SUMMARY"

      - name: B. VPN 끄고 · 진짜 읽기
        env:
          SHEET_BRIDGE_URL: ${{ secrets.SHEET_BRIDGE_URL }}
          TOK: ${{ secrets.SHEET_BRIDGE_TOKEN }}
        run: |
          set +e
          echo "── B. VPN 끄고 · 진짜 읽기 ── (진짜 잠금값으로 실제 읽기(시트 내용을 통째로 실어 온다))"
          C=$(curl -fsS --max-time 10 https://ipinfo.io/country | tr -d '[:space:]')
          echo "출구 국가: $C"
          ok=0; bad=0
          for i in 1 2 3 4 5 6 7 8; do
            H=$(curl -s -o /dev/null -D - --max-time 60 -X POST "$SHEET_BRIDGE_URL" \
                 -H 'Content-Type: application/json' \
                 -d "{\"token\":\"$TOK\",\"action\":\"read\"}" | tr -d '\r')
            S1=$(echo "$H" | awk '/^HTTP\//{print $2}' | head -1)
            L=$(echo "$H" | awk 'BEGIN{IGNORECASE=1}/^location:/{print $2}')
            if [ -z "$L" ]; then echo "  $i) POST=$S1 넘김없음"; bad=$((bad+1)); sleep 2; continue; fi
            S2=$(curl -s -o /tmp/ans.bin -w '%{http_code}' --max-time 60 "$L")
            N=$(wc -c < /tmp/ans.bin | tr -d ' ')
            # 내용은 절대 찍지 않는다 — 업체명·도메인이 공개 로그에 남으면 안 된다.
            if [ "$S2" = "200" ] && [ "$N" -gt 20 ]; then ok=$((ok+1)); else bad=$((bad+1)); fi
            echo "  $i) POST=$S1 → 답 $S2 · ${N}바이트"
            sleep 2
          done
          echo "결과: 성공 $ok / 실패 $bad"
          { echo "## B. VPN 끄고 · 진짜 읽기"; echo "- 출구 국가: $C"; echo "- **성공 $ok / 실패 $bad** (8회)"; echo; } >> "$GITHUB_STEP_SUMMARY"

      - name: OpenVPN 설치
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/*google* 2>/dev/null || true
          for i in 1 2 3; do
            if sudo apt-get update -qq; then break; fi
            sleep 5
          done
          sudo apt-get install -y -qq openvpn openvpn-systemd-resolved || true
          command -v openvpn >/dev/null || { echo "::error::openvpn 설치 실패"; exit 1; }

      - name: NordVPN 한국 서버 접속 (다중 서버 재시도)
        env:
          NORDVPN_USER: ${{ secrets.NORDVPN_USER }}
          NORDVPN_PASS: ${{ secrets.NORDVPN_PASS }}
        run: |
          # ★ set -e 로 죽지 않게 한다. 서버 하나가 실패해도 다음 서버로 넘어가야 하고,
          #   전부 실패해도 check.js 가 실행되어 '한국 IP 아님' 경고를 텔레그램으로 보내야 한다.
          set +e
          set -u

          if [ -z "${NORDVPN_USER}" ] || [ -z "${NORDVPN_PASS}" ]; then
            echo "::warning::NordVPN 자격증명이 없습니다 — 점검은 KR 검증 단계에서 중단됩니다"
            exit 0
          fi

          umask 077
          printf '%s\n%s\n' "$NORDVPN_USER" "$NORDVPN_PASS" > /tmp/nordauth.txt
          chmod 600 /tmp/nordauth.txt

          # 추천 한국 서버 목록(country_id 114 = 대한민국). 실패하면 전체 목록으로 대체.
          HOSTS=$(curl -fsS --max-time 20 \
            'https://api.nordvpn.com/v1/servers/recommendations?filters%5Bcountry_id%5D=114&filters%5Bservers_technologies%5D%5Bidentifier%5D=openvpn_udp&limit=6' \
            | jq -r '.[].hostname' 2>/dev/null | tr '\n' ' ')
          if [ -z "$(echo "${HOSTS:-}" | tr -d '[:space:]')" ]; then
            HOSTS=$(curl -fsS --max-time 20 \
              'https://api.nordvpn.com/v1/servers?filters%5Bcountry_id%5D=114&limit=200' \
              | jq -r '.[].hostname' 2>/dev/null | sort -u | head -6 | tr '\n' ' ')
          fi
          if [ -z "$(echo "${HOSTS:-}" | tr -d '[:space:]')" ]; then
            echo "::warning::NordVPN 서버 목록을 못 받았습니다"
            exit 0
          fi
          echo "후보 서버: $HOSTS"

          UPDOWN=""
          if [ -x /etc/openvpn/update-systemd-resolved ]; then
            UPDOWN="--script-security 2 --up /etc/openvpn/update-systemd-resolved --down /etc/openvpn/update-systemd-resolved --up-restart --dhcp-option DOMAIN-ROUTE ."
          fi

          stop_vpn() {
            sudo pkill -f openvpn >/dev/null 2>&1
            # tun0 이 완전히 사라질 때까지 기다린다 — 안 그러면 다음 서버에서 '죽은 터널'을 붙잡는다
            for _ in $(seq 1 15); do
              ip link show tun0 >/dev/null 2>&1 || return 0
              sleep 1
            done
          }

          for H in $HOSTS; do
            echo "── 시도: $H"
            rm -f /tmp/kr.ovpn
            sudo rm -f /tmp/openvpn.log

            # -f 필수: 이게 없으면 404 HTML 페이지를 설정파일로 받아 openvpn 이 즉시 죽는다
            if ! curl -fsS --max-time 30 -o /tmp/kr.ovpn \
              "https://downloads.nordcdn.com/configs/files/ovpn_udp/servers/${H}.udp.ovpn"; then
              echo "→ 설정 내려받기 실패, 다음 서버로"
              continue
            fi
            if ! grep -q '^remote ' /tmp/kr.ovpn; then
              echo "→ 설정 파일이 이상함, 다음 서버로"
              continue
            fi

            sudo openvpn --config /tmp/kr.ovpn \
              --auth-user-pass /tmp/nordauth.txt \
              --data-ciphers AES-256-GCM:AES-256-CBC --data-ciphers-fallback AES-256-CBC \
              --connect-retry-max 2 --connect-timeout 10 \
              $UPDOWN \
              --daemon --log /tmp/openvpn.log
            if [ $? -ne 0 ]; then
              echo "→ openvpn 실행 실패, 다음 서버로"
              stop_vpn
              continue
            fi

            # '터널이 생겼나'가 아니라 '연결이 끝났나'를 본다. 자격증명 오류를 60초 기다리지 않도록.
            CONNECTED=0
            for _ in $(seq 1 20); do
              sleep 1.5
              if sudo grep -q 'Initialization Sequence Completed' /tmp/openvpn.log 2>/dev/null; then CONNECTED=1; break; fi
              if sudo grep -qE 'AUTH_FAILED|auth-failure|Cannot resolve host|process restarting|Exiting due to fatal error' /tmp/openvpn.log 2>/dev/null; then break; fi
              pgrep -f openvpn >/dev/null 2>&1 || break
            done
            if [ "$CONNECTED" != "1" ]; then
              echo "→ 연결 실패"
              sudo tail -n 5 /tmp/openvpn.log 2>/dev/null | sed -e 's/[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}/x.x.x.x/g'
              stop_vpn
              continue
            fi

            C=$(curl -fsS --max-time 10 https://ipinfo.io/country | tr -d '[:space:]')
            echo "출구 국가: ${C:-확인불가}"
            if [ "$C" = "KR" ]; then
              echo "✅ 한국 서버 연결: $H"
              exit 0
            fi

            echo "→ 한국이 아님, 다음 서버로"
            stop_vpn
          done

          echo "::warning::한국 서버에 붙지 못했습니다 — 점검은 KR 검증 단계에서 중단되고 경고만 발송됩니다"
          sudo tail -n 20 /tmp/openvpn.log 2>/dev/null | sed -e 's/[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}/x.x.x.x/g'
          exit 0

      - name: C. VPN 켜고 · 짧은 답
        env:
          SHEET_BRIDGE_URL: ${{ secrets.SHEET_BRIDGE_URL }}
          TOK: 
        run: |
          set +e
          echo "── C. VPN 켜고 · 짧은 답 ── (틀린 잠금값 — 짧은 답만 온다)"
          C=$(curl -fsS --max-time 10 https://ipinfo.io/country | tr -d '[:space:]')
          echo "출구 국가: $C"
          ok=0; bad=0
          for i in 1 2 3 4 5 6 7 8; do
            H=$(curl -s -o /dev/null -D - --max-time 60 -X POST "$SHEET_BRIDGE_URL" \
                 -H 'Content-Type: application/json' \
                 -d "{\"token\":\"$TOK\",\"action\":\"read\"}" | tr -d '\r')
            S1=$(echo "$H" | awk '/^HTTP\//{print $2}' | head -1)
            L=$(echo "$H" | awk 'BEGIN{IGNORECASE=1}/^location:/{print $2}')
            if [ -z "$L" ]; then echo "  $i) POST=$S1 넘김없음"; bad=$((bad+1)); sleep 2; continue; fi
            S2=$(curl -s -o /tmp/ans.bin -w '%{http_code}' --max-time 60 "$L")
            N=$(wc -c < /tmp/ans.bin | tr -d ' ')
            # 내용은 절대 찍지 않는다 — 업체명·도메인이 공개 로그에 남으면 안 된다.
            if [ "$S2" = "200" ] && [ "$N" -gt 20 ]; then ok=$((ok+1)); else bad=$((bad+1)); fi
            echo "  $i) POST=$S1 → 답 $S2 · ${N}바이트"
            sleep 2
          done
          echo "결과: 성공 $ok / 실패 $bad"
          { echo "## C. VPN 켜고 · 짧은 답"; echo "- 출구 국가: $C"; echo "- **성공 $ok / 실패 $bad** (8회)"; echo; } >> "$GITHUB_STEP_SUMMARY"

      - name: D. VPN 켜고 · 진짜 읽기
        env:
          SHEET_BRIDGE_URL: ${{ secrets.SHEET_BRIDGE_URL }}
          TOK: ${{ secrets.SHEET_BRIDGE_TOKEN }}
        run: |
          set +e
          echo "── D. VPN 켜고 · 진짜 읽기 ── (진짜 잠금값으로 실제 읽기(시트 내용을 통째로 실어 온다))"
          C=$(curl -fsS --max-time 10 https://ipinfo.io/country | tr -d '[:space:]')
          echo "출구 국가: $C"
          ok=0; bad=0
          for i in 1 2 3 4 5 6 7 8; do
            H=$(curl -s -o /dev/null -D - --max-time 60 -X POST "$SHEET_BRIDGE_URL" \
                 -H 'Content-Type: application/json' \
                 -d "{\"token\":\"$TOK\",\"action\":\"read\"}" | tr -d '\r')
            S1=$(echo "$H" | awk '/^HTTP\//{print $2}' | head -1)
            L=$(echo "$H" | awk 'BEGIN{IGNORECASE=1}/^location:/{print $2}')
            if [ -z "$L" ]; then echo "  $i) POST=$S1 넘김없음"; bad=$((bad+1)); sleep 2; continue; fi
            S2=$(curl -s -o /tmp/ans.bin -w '%{http_code}' --max-time 60 "$L")
            N=$(wc -c < /tmp/ans.bin | tr -d ' ')
            # 내용은 절대 찍지 않는다 — 업체명·도메인이 공개 로그에 남으면 안 된다.
            if [ "$S2" = "200" ] && [ "$N" -gt 20 ]; then ok=$((ok+1)); else bad=$((bad+1)); fi
            echo "  $i) POST=$S1 → 답 $S2 · ${N}바이트"
            sleep 2
          done
          echo "결과: 성공 $ok / 실패 $bad"
          { echo "## D. VPN 켜고 · 진짜 읽기"; echo "- 출구 국가: $C"; echo "- **성공 $ok / 실패 $bad** (8회)"; echo; } >> "$GITHUB_STEP_SUMMARY"

      - name: 뒷정리
        if: always()
        run: |
          sudo pkill openvpn 2>/dev/null || true
          rm -f /tmp/nordauth.txt /tmp/ans.bin || true
